<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="M-Test入力">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="referrer" content="no-referrer">
  <title>M-Test 入力</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">M-Test 入力</div>
    <div class="topbar-right">
      <span id="net-status" class="net"></span>
      <button id="btn-sync" class="pill" type="button">未送信 0件</button>
      <button id="btn-data" class="topbtn" type="button">データ管理</button>
      <button id="btn-settings" class="topbtn" type="button">設定</button>
    </div>
  </header>

  <main>
    <!-- 基本情報 -->
    <section id="screen-info" class="screen">
      <div class="card info-card">
        <h1>基本情報</h1>

        <div class="field">
          <label for="name">氏名</label>
          <div class="name-wrap">
            <input id="name" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
                   placeholder="例：山田太郎（2回目以降は候補から選べます）">
            <ul id="suggest" class="suggest" hidden></ul>
          </div>
        </div>

        <div class="field">
          <span class="label">生年月日</span>
          <div class="birth">
            <select id="by" aria-label="年"></select><span>年</span>
            <select id="bm" aria-label="月"></select><span>月</span>
            <select id="bd" aria-label="日"></select><span>日</span>
            <span id="age" class="age"></span>
          </div>
        </div>

        <div class="field">
          <span class="label">性別</span>
          <div id="sex" class="choices"></div>
        </div>

        <div class="field">
          <span class="label">種目</span>
          <div>
            <div id="sport" class="choices"></div>
            <input id="sport-other" type="text" class="other-input" placeholder="種目名を入力" hidden>
          </div>
        </div>

        <div class="field">
          <span class="label">ポジション</span>
          <div>
            <div id="position" class="choices"><span class="hint">先に種目を選んでください</span></div>
            <input id="position-other" type="text" class="other-input" placeholder="ポジションを入力" hidden>
          </div>
        </div>

        <div class="field">
          <span class="label">利き手</span>
          <div id="hand" class="choices"></div>
        </div>

        <div class="field">
          <span class="label">利き脚</span>
          <div id="foot" class="choices"></div>
        </div>

        <h2 class="section-title">既往歴</h2>

        <div class="field">
          <span class="label">ケガ</span>
          <div>
            <div id="injury" class="choices"></div>
            <div id="injury-detail" class="sub" hidden>
              <div class="sub-row">
                <span class="sub-label">場所</span>
                <div>
                  <div id="injury-part" class="choices"></div>
                  <input id="injury-part-other" type="text" class="other-input" placeholder="場所を入力" hidden>
                </div>
              </div>
              <div class="sub-row">
                <span class="sub-label">状態</span>
                <div>
                  <div id="injury-type" class="choices"></div>
                  <input id="injury-type-other" type="text" class="other-input" placeholder="ケガの状態を入力" hidden>
                </div>
              </div>
              <div class="sub-row">
                <span class="sub-label">現在の状態</span>
                <div id="injury-now" class="choices"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <span class="label">疾患</span>
          <div>
            <div id="disease" class="choices"></div>
            <div id="disease-detail" class="sub" hidden>
              <div class="sub-row">
                <label class="sub-label" for="disease-name">疾患名</label>
                <input id="disease-name" type="text" autocomplete="off" placeholder="例：喘息">
              </div>
              <div class="sub-row">
                <span class="sub-label">現在の状態</span>
                <div id="disease-now" class="choices"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="btn-clear" type="button" class="btn ghost">クリア</button>
          <button id="btn-start" type="button" class="btn primary big">チェック開始 →</button>
        </div>
      </div>
    </section>

    <!-- チェック -->
    <section id="screen-check" class="screen" hidden>
      <div class="check-head">
        <button id="person" type="button" class="person" title="基本情報を修正"></button>
        <div class="progress">
          <div class="progress-text"><span id="prog-text">確認済 0/29</span><span id="abn-text" class="abn"></span></div>
          <div class="bar"><div id="prog-bar"></div></div>
        </div>
        <button id="btn-cancel" type="button" class="btn ghost">中止</button>
        <button id="btn-save" type="button" class="btn primary">保存</button>
      </div>
      <div id="check-grid" class="check-grid"></div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
